openapi: 3.0.3
info:
  title: Swagger Petstore - OpenAPI 3.0
  description: |-
    This is a sample Pet Store Server based on the OpenAPI 3.0 specification.  You can find out more about
    Swagger at [https://swagger.io](https://swagger.io).
  version: 1.0.11
servers:
  - url: https://localhost:8080
tags:
  - name: card
    description: Operations about user
  - name: bank-account
    description: Access to Petstore orders
  - name: users
    description: Everything about your Pets
paths:
  /users:
    get:
      tags:
        - users
      summary: Update an existing pet
      description: Retrieve all users
      operationId: getAllUsers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                {}
            application/xml:
              schema:
                {}
        '204':
          description: No content
          content:
            application/json:
              schema:
                {}
        '404':
          description: Pet not found
        '422':
          description: Validation exception
      security:
        - petstore_auth:
            - write:pets
            - read:pets
components:
  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        type:
          type: string
        message:
          type: string
      xml:
        name: '##default'
  requestBodies:
    Pet:
      description: Pet object that needs to be added to the store
      content:
        application/json:
          schema:
            {}
        application/xml:
          schema:
            {}
    UserArray:
      description: List of user object
      content:
        application/json:
          schema:
            type: array
            items:
              {}
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: http://user.authorization
          scopes:
            write:users: modify users account
            read:users: read users
    api_key:
      type: apiKey
      name: api_key
      in: header